name: Build bot.jar

on:
  push:
    branches:
      - main
    paths:
      - 'Bot.java'
      - '.github/workflows/build-botjar.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types: [created]
  workflow_dispatch:
    # GitHub硬限制：workflow_dispatch最多10个inputs，原26个独立输入会被直接拒收。
    # 改为 version + config(多行KEY=VALUE) 两个输入，25个烧入键全部保留。
    inputs:
      version:
        description: '版本号，如v1.0.0，留空则更新latest'
        required: false
        default: ''
        type: string
      config:
        description: '烧入配置，每行 KEY=VALUE。键：UUID ARGO_DOMAIN ARGO_AUTH ARGO_PORT PORT SUB_PATH CFIP CFPORT NAME SHOW_LOG DEBUG WSPATH DOMAIN SECURITY PUBLIC_PORT SERVER_PORT S5_PORT HY2_PORT REALITY_PORT REALITY_SNI CFSM_URL CFSM_ID CFSM_SECRET CFSM_INTERVAL GOMEMLIMIT。例：UUID=xxx / ARGO_AUTH={"a":1}。留空则不烧入'
        required: false
        default: ''
        type: string

jobs:
  build-botjar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Burn env defaults into source
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_CONFIG: ${{ inputs.config }}
        run: |
          FILE="Bot.java"
          # jesc：把输入转成可安全塞进Java字符串字面量 + sed替换体的形式
          # （ARGO_AUTH是含双引号的JSON，全靠这层转义不断编译；
          # 注意双引号要编成6反斜杠+引号：外层sed替换体会吃掉一层，
          # 实测 s/"/\\"/g 会让引号裸奔导致javac失败）
          jesc() {
            printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\\\\\"/g' -e 's/&/\\&/g' -e 's/|/\\|/g'
          }
          burn() {
            local key="$1" val="$2"
            if [ -n "$val" ]; then
              local esc
              esc="$(jesc "$val")"
              sed -i "s|{\"$key\", \"[^\"]*\"}|{\"$key\", \"$esc\"}|" "$FILE"
            fi
          }
          # config输入：多行KEY=VALUE，按首个=切分；空行/#注释跳过；兼容Windows粘贴带来的CR
          if [ -n "$IN_CONFIG" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in ''|\#*) continue;; esac
              key="${line%%=*}"
              val="${line#*=}"
              key="$(printf '%s' "$key" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              case "$key" in ''|*[!A-Za-z0-9_]*)
                echo "::warning::skip invalid config line: $line"
                continue
                ;;
              esac
              burn "$key" "$val"
            done <<< "$IN_CONFIG"
          fi
          echo "========== Burned, $(grep -c '{"' "$FILE") config entries =========="

      - name: Compile with javac
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out Bot.java
          printf 'Main-Class: Bot\n' > MANIFEST.MF
          jar cfm bot.jar MANIFEST.MF -C out .
          ls -la bot.jar
          java -jar bot.jar || test $? -eq 1
          echo "smoke test passed (exit 1 = target web not found, as expected)"

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$(echo "$INPUT_VERSION" | sed 's/[[:space:]]\+/-/g')"
          else
            VERSION="latest"
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid version: [$VERSION]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Rename jar
        run: |
          cp bot.jar "bot-${{ steps.ver.outputs.version }}.jar"

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: web-bot ${{ steps.ver.outputs.version }}
          body: |
            ## Usage
            Download `bot-${{ steps.ver.outputs.version }}.jar`, put it next to the `web` binary and run:
            `java -jar bot-<version>.jar`
            Or burn config at build time via Actions → Run workflow (config input, one KEY=VALUE per line).

            Env vars (panel env wins over burned defaults): UUID / ARGO_DOMAIN / ARGO_AUTH / ARGO_PORT / PORT / SUB_PATH / CFIP / CFPORT / NAME / SHOW_LOG / DEBUG / WSPATH / DOMAIN / SECURITY / PUBLIC_PORT / SERVER_PORT / S5_PORT / HY2_PORT / REALITY_PORT / REALITY_SNI / CFSM_URL / CFSM_ID / CFSM_SECRET / CFSM_INTERVAL / GOMEMLIMIT / BOT_BIN
          files: bot-*.jar
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bot-${{ steps.ver.outputs.version }}
          path: bot-*.jar
          retention-days: 30

      - name: Clean old runs
        if: github.event_name == 'workflow_dispatch'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 1
